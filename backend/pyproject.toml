[project]
name = "truck-routing-api"
version = "0.1.0"
description = "Weather-aware truck routing API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "flexpolyline>=0.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "api.settings"
pythonpath = ["."]
testpaths = ["tests"]
